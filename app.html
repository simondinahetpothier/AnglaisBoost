<style>
  :root{
    --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF1F6;
    --ink:#131C2B; --muted:#5C6675; --hair:#E1E6EE;
    --accent:#3A5BDB; --accent-soft:#E4E9FF;
    --good:#0CA678; --good-soft:#D9F4EC;
    --warn:#E8590C; --streak:#F08C00; --streak-soft:#FFF0D6;
    --bad:#E03131; --bad-soft:#FCE4E4;
    --purple:#7048E8; --purple-soft:#EDE7FF;
    --shadow:0 1px 2px rgba(19,28,43,.06),0 8px 24px rgba(19,28,43,.07);
    --r:18px; --r-sm:12px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0D1420; --surface:#151F2E; --surface-2:#1D2A3C;
      --ink:#E7ECF3; --muted:#93A0B4; --hair:#26344A;
      --accent:#748FFC; --accent-soft:#22315A;
      --good:#38D9A9; --good-soft:#123A31;
      --warn:#FF922B; --streak:#FFB454; --streak-soft:#3A2A10;
      --bad:#FF6B6B; --bad-soft:#3A1A1A;
      --purple:#B197FC; --purple-soft:#2A2350;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1420; --surface:#151F2E; --surface-2:#1D2A3C;
    --ink:#E7ECF3; --muted:#93A0B4; --hair:#26344A;
    --accent:#748FFC; --accent-soft:#22315A;
    --good:#38D9A9; --good-soft:#123A31;
    --warn:#FF922B; --streak:#FFB454; --streak-soft:#3A2A10;
    --bad:#FF6B6B; --bad-soft:#3A1A1A;
    --purple:#B197FC; --purple-soft:#2A2350;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:620px; margin:0 auto; padding:18px 16px 8px;}
  h1,h2,h3{margin:0; text-wrap:balance; line-height:1.2}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  textarea{font-family:inherit}
  .muted{color:var(--muted)}
  .tnum{font-variant-numeric:tabular-nums}
  .hidden{display:none!important}

  .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px}
  .brand{display:flex; align-items:center; gap:10px}
  .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--purple));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;box-shadow:var(--shadow)}
  .brand b{font-size:16px;letter-spacing:-.2px}
  .brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}
  .icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface);display:grid;place-items:center;
    box-shadow:var(--shadow);color:var(--muted)}

  .card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
  .card + .card{margin-top:14px}

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
  .chip.streak{background:var(--streak-soft);color:var(--streak)}
  .chip.acc{background:var(--accent-soft);color:var(--accent)}
  .chip.good{background:var(--good-soft);color:var(--good)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;
    padding:15px 18px;border-radius:14px;background:var(--accent);color:#fff;width:100%;box-shadow:var(--shadow)}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
  .btn:disabled{opacity:.5}
  .btn.sm{font-size:14px;padding:11px 14px;width:auto}

  .section-title{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:22px 4px 10px}
  .row{display:flex;align-items:center;gap:12px}
  .spread{justify-content:space-between}

  .speak-btn{width:42px;height:42px;min-width:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
  .speak-btn.lg{width:52px;height:52px;min-width:52px}

  /* topic pill row */
  .topics{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .topic{display:flex;align-items:center;gap:13px;background:var(--surface);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow)}
  .topic .em{width:42px;height:42px;min-width:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--surface-2)}
  .topic b{font-size:14.5px;display:block}
  .topic span{font-size:12.5px;color:var(--muted)}

  /* mission flow */
  .prog{display:flex;gap:4px;align-items:center;margin-bottom:16px}
  .prog i{height:5px;flex:1;border-radius:999px;background:var(--surface-2)}
  .prog i.on{background:var(--accent)}
  .step-kicker{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .headline{font-size:23px;font-weight:800;letter-spacing:-.4px;margin:2px 0 10px}
  .blurb{font-size:16px;line-height:1.6;color:var(--ink)}
  .area-tag{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}

  .prompt-q{font-size:18px;font-weight:700;line-height:1.4;margin:6px 0 14px}
  textarea.answer{width:100%;min-height:96px;border:1.5px solid var(--hair);background:var(--surface-2);color:var(--ink);
    border-radius:13px;padding:13px 14px;font-size:15px;line-height:1.5;resize:vertical;outline:none}
  textarea.answer:focus{border-color:var(--accent)}
  .model{background:var(--good-soft);border-radius:13px;padding:14px 15px;margin-top:12px;font-size:15.5px;line-height:1.55;position:relative}
  .model .lab{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--good);margin-bottom:5px}
  .model .row{align-items:flex-start}

  .rate{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
  .rate button{padding:13px 4px;border-radius:13px;font-weight:700;font-size:13px;background:var(--surface);box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:3px;align-items:center}
  .rate button .e{font-size:20px}

  .phrase{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--hair)}
  .phrase:last-child{border:none}
  .phrase .txt{flex:1}
  .phrase .en{font-weight:700;font-size:15.5px}
  .phrase .fr{font-size:13px;color:var(--muted)}
  .keep{width:40px;height:40px;min-width:40px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:18px;font-weight:800}
  .keep.on{background:var(--good-soft);color:var(--good)}

  .fixq{margin-bottom:6px}
  .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 15px;border-radius:13px;background:var(--surface);
    box-shadow:var(--shadow);font-size:15px;font-weight:600;margin-bottom:9px;border:2px solid transparent;transition:.15s}
  .opt:active{transform:scale(.99)}
  .opt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .opt.dim{opacity:.5}
  .why{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;margin:2px 0 4px}
  .why b{color:var(--accent)}

  .say-item{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:14px;padding:14px 15px;margin-bottom:10px}
  .say-item .t{flex:1;font-size:16px;font-weight:700}
  .say-item .done-tag{color:var(--good);font-weight:800;font-size:20px}

  .center{text-align:center}
  .big-emoji{font-size:52px;margin-bottom:6px}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:3px}
  .stat .n{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
  .stat .l{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--hair);
    display:flex;justify-content:space-around;padding:9px 6px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.06)}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;padding:4px 2px;border-radius:12px}
  .nav button.active{color:var(--accent)}
  .nav svg{width:24px;height:24px}

  .fade{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">EB</div>
      <div><b>English Boost</b><small id="tagline">Ta mission d'anglais du jour</small></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Thème clair/sombre" title="Thème">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v1M12 20v1M4.2 4.2l.7.7M19.1 19.1l.7.7M3 12h1M20 12h1M4.2 19.8l.7-.7M19.1 4.9l.7-.7"/><circle cx="12" cy="12" r="4"/></svg>
    </button>
  </div>

  <section id="view-home"></section>
  <section id="view-mission" class="hidden"></section>
  <section id="view-review" class="hidden"></section>
  <section id="view-progress" class="hidden"></section>
</div>

<nav class="nav">
  <button data-go="home" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 12.5a1 1 0 0 0 .8 1.6H11l-1 7.9 8.5-10.9a1 1 0 0 0-.8-1.6H12z"/></svg>
    Mission</button>
  <button data-go="review">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v14l-4-3H5a2 2 0 0 1-2-2z"/><path d="M8 8h6M8 11h4"/></svg>
    Réviser</button>
  <button data-go="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Progrès</button>
</nav>

<script>
(function(){
  "use strict";

  /* ===== Seed content (rafraîchi chaque jour par la routine cloud) ===== */
  const MISSION = {
    date:"2026-09-08",
    items:[
      {
        area:"Business", emoji:"💼",
        headline:"US economy adds 162,000 jobs in August",
        blurb:"American companies created 162,000 new jobs last month, more than experts expected. The unemployment rate stayed low at 4.1%, and the stock market went up.",
        react:"Is this good or bad news for the economy? Say what you think in 1-2 sentences.",
        model:"I think it's good news. When companies hire more people, families have money to spend, and that usually helps the whole economy grow.",
        phrases:[["to hire","embaucher"],["above expectations","au-dessus des attentes"],["the job market","le marché du travail"],["to spend money","dépenser de l'argent"]],
        say:["The economy added more jobs than expected.","Unemployment stayed low."],
        fix:{wrong:"The unemployment is very low.", right:"Unemployment is very low.", why:"« unemployment » est un nom général indénombrable : pas de « the » devant."}
      },
      {
        area:"Création de contenu", emoji:"🎬",
        headline:"YouTube plans stricter rules to earn money",
        blurb:"YouTube will make it harder to earn money from ads in early 2027. Because of this, many creators are building other income: memberships, merch, and brand deals.",
        react:"If you were a creator, how would you make money besides ads? Answer in 1-2 sentences.",
        model:"If I were a creator, I would sell my own products and offer a paid membership, so I wouldn't depend only on ads.",
        phrases:[["a creator","un créateur de contenu"],["income","revenu"],["a brand deal","un partenariat de marque"],["to depend on","dépendre de"]],
        say:["Creators want more ways to earn money.","Ads are not the only income."],
        fix:{wrong:"I depend of my sponsors.", right:"I depend on my sponsors.", why:"En anglais on dit « depend ON », jamais « depend of »."}
      },
      {
        area:"Gaming", emoji:"🎮",
        headline:"Marvel's Wolverine launches on PS5",
        blurb:"The new game Marvel's Wolverine, made by Insomniac Games, comes out on PlayStation 5 on September 15. Fans have waited years for this action game.",
        react:"Are you excited about this game? Why or why not? Answer in 1-2 sentences.",
        model:"Honestly, I'm quite excited. I loved Insomniac's Spider-Man games, so I can't wait to see what they do with Wolverine.",
        phrases:[["to come out","sortir (un jeu, un film)"],["to look forward to","avoir hâte de"],["a sequel","une suite"],["to be worth it","valoir le coup"]],
        say:["The game comes out on September the 15th.","I can't wait to play it."],
        fix:{wrong:"I'm agree with you.", right:"I agree with you.", why:"« agree » est un verbe : on dit « I agree », jamais « I am agree »."}
      }
    ]
  };

  /* ===== Persistence ===== */
  const KEY="englishboost.v2";
  const todayStr=()=>new Date().toISOString().slice(0,10);
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  const defaults={streak:0,lastActive:null,days:[],missions:0,xp:0,
    lastMissionDate:null, saved:[], sched:{}, theme:null};
  let state=Object.assign({},defaults,load());

  function markActiveToday(){
    const t=todayStr();
    if(!state.days.includes(t)) state.days.push(t);
    if(state.lastActive===t) return;
    const yest=new Date(Date.now()-864e5).toISOString().slice(0,10);
    state.streak=(state.lastActive===yest)?state.streak+1:1;
    state.lastActive=t; save();
  }

  /* ===== Theme ===== */
  const root=document.documentElement;
  function applyTheme(){ if(state.theme) root.setAttribute("data-theme",state.theme); else root.removeAttribute("data-theme"); }
  applyTheme();
  document.getElementById("themeBtn").addEventListener("click",()=>{
    const dark=state.theme?state.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    state.theme=dark?"light":"dark"; save(); applyTheme();
  });

  /* ===== Speech (TTS, gratuit) ===== */
  function speak(t){
    if(!("speechSynthesis" in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang="en-GB"; u.rate=.94;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/en/i.test(v.lang));
    if(v)u.voice=v; speechSynthesis.speak(u);
  }
  if("speechSynthesis" in window) speechSynthesis.onvoiceschanged=()=>{};
  const spkSvg='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>';

  /* ===== Review deck helpers ===== */
  function isSaved(en){ return state.saved.some(p=>p.en===en); }
  function toggleSave(p){
    if(isSaved(p.en)){ state.saved=state.saved.filter(x=>x.en!==p.en); delete state.sched[p.en]; }
    else{ state.saved.push({en:p.en,fr:p.fr}); state.sched[p.en]={due:todayStr(),interval:0,ease:2.3,reps:0}; }
    save();
  }
  function dueSaved(){ const t=todayStr(); return state.saved.filter(p=>{const s=state.sched[p.en];return !s||s.due<=t;}); }
  function reviewPhrase(en,q){ // q:0 again,1 good,2 easy
    const s=state.sched[en]||{interval:0,ease:2.3,reps:0};
    if(q===0){s.interval=0;s.ease=Math.max(1.6,s.ease-.2);}
    else{ s.interval=s.reps===0?(q===2?3:1):Math.round(s.interval*(s.ease+(q-1)*.2))||1; s.ease=Math.min(3,s.ease+(q-1)*.1); s.reps++; }
    s.due=new Date(Date.now()+Math.max(0,s.interval)*864e5).toISOString().slice(0,10);
    state.sched[en]=s; save();
  }

  /* ===== Router ===== */
  const views={home:v("home"),mission:v("mission"),review:v("review"),progress:v("progress")};
  function v(n){return document.getElementById("view-"+n);}
  const R={};
  function go(n){
    for(const k in views) views[k].classList.toggle("hidden",k!==n);
    document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.go===n));
    (R[n]||(()=>{}))();
    views[n].classList.remove("fade"); void views[n].offsetWidth; views[n].classList.add("fade");
    scrollTo(0,0);
  }
  document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));

  /* ===== HOME ===== */
  R.home=function(){
    const doneToday=state.lastMissionDate===todayStr();
    const due=dueSaved().length;
    const dateTxt=fmtDate(MISSION.date);
    views.home.innerHTML=`
      <div class="card" style="background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff">
        <div class="row spread">
          <div style="font-size:13px;opacity:.92;font-weight:600">${greeting()}</div>
          <div class="chip" style="background:rgba(255,255,255,.22);color:#fff">🔥 ${state.streak} j</div>
        </div>
        <h2 style="font-size:24px;margin:8px 0 4px">${doneToday?"Mission accomplie ✅":"Ta mission du jour"}</h2>
        <div style="font-size:13px;opacity:.9">${dateTxt} · 3 sujets · ~5 min</div>
      </div>

      <div class="section-title">Au programme aujourd'hui</div>
      <div class="topics">
        ${MISSION.items.map(it=>`
          <div class="topic">
            <div class="em">${it.emoji}</div>
            <div style="flex:1"><b>${esc(it.headline)}</b><span>${it.area}</span></div>
          </div>`).join("")}
      </div>

      <div style="margin-top:18px">
        <button class="btn" id="startBtn">${doneToday?"↻ Refaire la mission":"▶ Commencer la mission"}</button>
      </div>
      ${due>0?`<button class="btn ghost" id="revBtn" style="margin-top:10px">📇 Réviser ${due} expression(s)</button>`:""}

      <p class="muted center" style="font-size:12px;margin:20px 4px 4px">Astuce : lis les phrases <b>à voix haute</b> — c'est là que l'oral progresse 🗣️</p>
    `;
    views.home.querySelector("#startBtn").addEventListener("click",startMission);
    const rb=views.home.querySelector("#revBtn"); if(rb) rb.addEventListener("click",()=>go("review"));
  };
  function greeting(){const h=new Date().getHours();return h<12?"Bonjour 👋":h<18?"Bon aprem 👋":"Bonsoir 👋";}
  function fmtDate(d){try{return new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});}catch(e){return d;}}
  function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  /* ===== MISSION FLOW ===== */
  let steps=[], mi=0;
  function startMission(){
    steps=[];
    MISSION.items.forEach((it,i)=>{ steps.push({t:"actu",i}); steps.push({t:"react",i}); steps.push({t:"phrases",i}); });
    steps.push({t:"fix"}); steps.push({t:"speak"}); steps.push({t:"done"});
    mi=0; go("mission"); renderStep();
  }
  function progBar(){ const tot=steps.length-1; return `<div class="prog">${steps.slice(0,tot).map((_,k)=>`<i class="${k<mi?'on':''}"></i>`).join("")}</div>`; }
  function next(){ mi++; renderStep(); }

  function renderStep(){
    const s=steps[mi]; const el=views.mission;
    if(s.t==="actu"){
      const it=MISSION.items[s.i];
      el.innerHTML=`${progBar()}
        <span class="area-tag">${it.emoji} ${it.area}</span>
        <div class="card" style="margin-top:12px">
          <div class="step-kicker">📰 L'actu</div>
          <div class="headline">${esc(it.headline)}</div>
          <div class="row" style="align-items:flex-start">
            <div class="blurb" style="flex:1">${esc(it.blurb)}</div>
          </div>
          <button class="btn sec sm" id="listen" style="margin-top:14px">${spkSvg} Écouter</button>
        </div>
        <button class="btn" id="nx" style="margin-top:16px">Continuer</button>`;
      el.querySelector("#listen").addEventListener("click",()=>speak(it.headline+". "+it.blurb));
      el.querySelector("#nx").addEventListener("click",next);
      setTimeout(()=>speak(it.headline),300);
    }
    else if(s.t==="react"){
      const it=MISSION.items[s.i];
      el.innerHTML=`${progBar()}
        <span class="area-tag">${it.emoji} ${it.area}</span>
        <div class="card" style="margin-top:12px">
          <div class="step-kicker">🗣️ À toi de jouer</div>
          <div class="prompt-q">${esc(it.react)}</div>
          <textarea class="answer" id="ans" placeholder="Écris ta réponse en anglais… (ou dis-la à voix haute)"></textarea>
          <button class="btn" id="reveal" style="margin-top:12px">Voir une réponse modèle</button>
          <div id="after" class="hidden">
            <div class="model">
              <div class="lab">Une façon naturelle de le dire</div>
              <div class="row">
                <div style="flex:1;font-weight:600" id="mtxt">${esc(it.model)}</div>
                <button class="speak-btn" id="mspk" aria-label="Écouter">${spkSvg}</button>
              </div>
            </div>
            <p class="muted" style="font-size:13px;margin:14px 4px 6px">Compare avec ta réponse. C'était comment ?</p>
            <div class="rate">
              <button data-q="0"><span class="e">😅</span>Dur</button>
              <button data-q="1"><span class="e">👍</span>Ça va</button>
              <button data-q="2"><span class="e">😎</span>Facile</button>
            </div>
          </div>
        </div>`;
      el.querySelector("#reveal").addEventListener("click",function(){
        this.classList.add("hidden");
        el.querySelector("#after").classList.remove("hidden");
        el.querySelector("#after").classList.add("fade");
        speak(it.model);
      });
      el.querySelector("#mspk").addEventListener("click",()=>speak(it.model));
      el.querySelectorAll(".rate button").forEach(b=>b.addEventListener("click",()=>{ addXp(4); next(); }));
    }
    else if(s.t==="phrases"){
      const it=MISSION.items[s.i];
      el.innerHTML=`${progBar()}
        <span class="area-tag">${it.emoji} ${it.area}</span>
        <div class="card" style="margin-top:12px">
          <div class="step-kicker">💎 Vole ces mots</div>
          <p class="muted" style="font-size:13.5px;margin:0 0 8px">Touche ＋ pour garder une expression et la réviser plus tard.</p>
          <div id="plist">
            ${it.phrases.map((p,k)=>`
              <div class="phrase">
                <button class="speak-btn" data-say="${k}" aria-label="Écouter">${spkSvg}</button>
                <div class="txt"><div class="en">${esc(p[0])}</div><div class="fr">${esc(p[1])}</div></div>
                <button class="keep ${isSaved(p[0])?'on':''}" data-keep="${k}">${isSaved(p[0])?'✓':'＋'}</button>
              </div>`).join("")}
          </div>
        </div>
        <button class="btn" id="nx" style="margin-top:16px">Continuer</button>`;
      el.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>speak(it.phrases[+b.dataset.say][0])));
      el.querySelectorAll("[data-keep]").forEach(b=>b.addEventListener("click",()=>{
        const p={en:it.phrases[+b.dataset.keep][0],fr:it.phrases[+b.dataset.keep][1]};
        toggleSave(p); b.classList.toggle("on",isSaved(p.en)); b.textContent=isSaved(p.en)?'✓':'＋';
      }));
      el.querySelector("#nx").addEventListener("click",next);
    }
    else if(s.t==="fix"){
      const fixes=MISSION.items.map(it=>it.fix);
      el.innerHTML=`${progBar()}
        <div class="card">
          <div class="step-kicker">🔧 Le petit fix</div>
          <p class="muted" style="font-size:13.5px;margin:0 0 14px">Quelle version est correcte ?</p>
          <div id="fixes"></div>
        </div>
        <button class="btn hidden" id="nx" style="margin-top:16px">Continuer</button>`;
      const box=el.querySelector("#fixes"); let solved=0;
      fixes.forEach((fx,idx)=>{
        const correctRight=Math.random()<.5;
        const a=correctRight?fx.right:fx.wrong, b=correctRight?fx.wrong:fx.right;
        const w=document.createElement("div"); w.className="fixq"; w.style.marginBottom="18px";
        w.innerHTML=`
          <button class="opt" data-correct="${correctRight?1:0}">${esc(a)}</button>
          <button class="opt" data-correct="${correctRight?0:1}">${esc(b)}</button>
          <div class="why hidden"><b>✓ ${esc(fx.right)}</b><br>${esc(fx.why)}</div>`;
        const opts=w.querySelectorAll(".opt"), why=w.querySelector(".why");
        opts.forEach(o=>o.addEventListener("click",()=>{
          if(w.dataset.done)return; w.dataset.done="1";
          opts.forEach(x=>{x.classList.add("dim"); if(x.dataset.correct==="1")x.classList.add("correct");});
          if(o.dataset.correct==="1"){addXp(2);} else {o.classList.remove("dim");o.classList.add("wrong");}
          why.classList.remove("hidden"); why.classList.add("fade");
          solved++; if(solved===fixes.length){ const n=el.querySelector("#nx"); n.classList.remove("hidden"); }
        }));
        box.appendChild(w);
      });
      el.querySelector("#nx").addEventListener("click",next);
    }
    else if(s.t==="speak"){
      const says=[]; MISSION.items.forEach(it=>it.say.forEach(x=>says.push(x)));
      el.innerHTML=`${progBar()}
        <div class="card">
          <div class="step-kicker">🎙️ Dis-le à voix haute</div>
          <p class="muted" style="font-size:13.5px;margin:0 0 14px">Écoute, puis répète à voix haute. Coche quand c'est fait.</p>
          <div id="says">
            ${says.map((t,k)=>`
              <div class="say-item" data-k="${k}">
                <button class="speak-btn" data-say="${k}" aria-label="Écouter">${spkSvg}</button>
                <div class="t">${esc(t)}</div>
                <button class="btn ghost sm" data-ok="${k}">Fait ✓</button>
              </div>`).join("")}
          </div>
        </div>
        <button class="btn" id="nx" style="margin-top:16px">Terminer la mission</button>`;
      el.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>speak(says[+b.dataset.say])));
      el.querySelectorAll("[data-ok]").forEach(b=>b.addEventListener("click",()=>{
        const it=el.querySelector('.say-item[data-k="'+b.dataset.ok+'"]');
        it.querySelector(".t").insertAdjacentHTML("afterend",'<span class="done-tag">✓</span>');
        b.remove();
      }));
      setTimeout(()=>speak(says[0]),300);
      el.querySelector("#nx").addEventListener("click",next);
    }
    else if(s.t==="done"){
      const first=state.lastMissionDate!==todayStr();
      if(first){ state.missions++; state.lastMissionDate=todayStr(); addXp(10); markActiveToday(); }
      const kept=state.saved.length;
      el.innerHTML=`
        <div class="card center fade">
          <div class="big-emoji">🎉</div>
          <h2 style="font-size:22px">Mission accomplie !</h2>
          <p class="muted" style="margin:6px 0 2px">Série : <b style="color:var(--streak)">🔥 ${state.streak} jour(s)</b></p>
          <p class="muted" style="margin:0 0 16px">${kept} expression(s) gardée(s) à réviser</p>
          <button class="btn" id="rev">📇 Réviser mes expressions</button>
          <button class="btn sec" id="home" style="margin-top:10px">Retour à l'accueil</button>
        </div>`;
      el.querySelector("#rev").addEventListener("click",()=>go("review"));
      el.querySelector("#home").addEventListener("click",()=>go("home"));
    }
  }
  function addXp(n){ state.xp+=n; save(); }

  /* ===== REVIEW ===== */
  let rq=[], ri=0, rShown=false;
  R.review=function(){
    rq=dueSaved(); ri=0; rShown=false;
    if(state.saved.length===0){
      views.review.innerHTML=`<div class="card center"><div class="big-emoji">📇</div>
        <h2 style="font-size:19px">Aucune expression gardée</h2>
        <p class="muted">Pendant la mission, touche ＋ sur les expressions que tu veux retenir. Elles apparaîtront ici pour la révision.</p>
        <button class="btn" id="gomission" style="margin-top:8px">Aller à la mission</button></div>`;
      views.review.querySelector("#gomission").addEventListener("click",()=>go("home")); return;
    }
    if(rq.length===0){
      views.review.innerHTML=`<div class="card center"><div class="big-emoji">✅</div>
        <h2 style="font-size:19px">Tout est révisé !</h2>
        <p class="muted">Tu es à jour sur tes ${state.saved.length} expression(s). Reviens plus tard.</p>
        <button class="btn sec" id="all" style="margin-top:8px">Revoir quand même</button></div>`;
      views.review.querySelector("#all").addEventListener("click",()=>{rq=state.saved.slice();ri=0;rShown=false;renderRev();}); return;
    }
    renderRev();
  };
  function renderRev(){
    if(ri>=rq.length){
      views.review.innerHTML=`<div class="card center fade"><div class="big-emoji">🎉</div>
        <h2 style="font-size:19px">Révision terminée</h2>
        <p class="muted">${rq.length} expression(s) revue(s). +${rq.length} XP</p>
        <button class="btn" id="home" style="margin-top:8px">Accueil</button></div>`;
      views.review.querySelector("#home").addEventListener("click",()=>go("home")); return;
    }
    const p=rq[ri];
    views.review.innerHTML=`
      <div class="prog">${rq.map((_,k)=>`<i class="${k<ri?'on':''}"></i>`).join("")}</div>
      <div class="muted" style="font-size:13px;font-weight:600;margin-bottom:8px">Carte ${ri+1} / ${rq.length}</div>
      <div class="card center" style="min-height:180px;display:flex;flex-direction:column;justify-content:center">
        <div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Traduis en anglais</div>
        <div style="font-size:22px;font-weight:800">${esc(p.fr)}</div>
        <div id="ans" class="hidden" style="margin-top:14px">
          <div class="row" style="justify-content:center"><div style="font-size:22px;font-weight:800;color:var(--good)">${esc(p.en)}</div>
          <button class="speak-btn" id="spk">${spkSvg}</button></div>
        </div>
        <button class="btn sec" id="show" style="margin-top:16px;width:auto;align-self:center;padding:11px 22px">Révéler</button>
      </div>
      <div id="rate" class="hidden"><div class="rate" style="margin-top:14px">
        <button data-q="0"><span class="e">😵</span>À revoir</button>
        <button data-q="1"><span class="e">🙂</span>Bien</button>
        <button data-q="2"><span class="e">😎</span>Facile</button>
      </div></div>`;
    views.review.querySelector("#show").addEventListener("click",function(){
      this.classList.add("hidden");
      views.review.querySelector("#ans").classList.remove("hidden");
      views.review.querySelector("#rate").classList.remove("hidden");
      speak(p.en);
    });
    views.review.querySelector("#spk").addEventListener("click",()=>speak(p.en));
    views.review.querySelectorAll(".rate button").forEach(b=>b.addEventListener("click",()=>{ reviewPhrase(p.en,+b.dataset.q); addXp(1); ri++; renderRev(); }));
  }

  /* ===== PROGRESS ===== */
  R.progress=function(){
    views.progress.innerHTML=`
      <h2 style="font-size:20px;margin-bottom:14px">Tes progrès</h2>
      <div class="stat-grid">
        <div class="stat"><span class="l">🔥 Série</span><span class="n tnum">${state.streak}</span><span class="muted" style="font-size:12px">jours d'affilée</span></div>
        <div class="stat"><span class="l">✅ Missions</span><span class="n tnum">${state.missions}</span><span class="muted" style="font-size:12px">au total</span></div>
        <div class="stat"><span class="l">💎 Expressions</span><span class="n tnum">${state.saved.length}</span><span class="muted" style="font-size:12px">gardées</span></div>
        <div class="stat"><span class="l">⭐ XP</span><span class="n tnum">${state.xp}</span><span class="muted" style="font-size:12px">points</span></div>
      </div>
      <div class="section-title">Ta semaine</div>
      <div class="card">${weekStrip()}</div>
      <p class="muted center" style="font-size:12px;margin:18px 4px 4px">L'actu se met à jour toute seule chaque matin 🌅</p>`;
  };
  function weekStrip(){
    const names=["L","M","M","J","V","S","D"]; let h='<div class="row" style="justify-content:space-between">';
    for(let i=6;i>=0;i--){
      const d=new Date(Date.now()-i*864e5), ds=d.toISOString().slice(0,10), on=state.days.includes(ds);
      let idx=d.getDay(); idx=idx===0?6:idx-1;
      h+=`<div style="text-align:center;flex:1"><div style="width:34px;height:34px;margin:0 auto;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;${on?'background:var(--accent);color:#fff':'background:var(--surface-2);color:var(--muted)'}">${on?'✓':names[idx]}</div><div style="font-size:10px;color:var(--muted);margin-top:4px">${names[idx]}</div></div>`;
    }
    return h+'</div>';
  }

  go("home");
})();
</script>
